name: SONIUM Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonium-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure Supabase public client
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=https://jengdekjfrizdypysjef.supabase.co" >> "$GITHUB_ENV"
          if [[ -n "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"
            echo "Supabase public client configured for Android bundle."
          else
            echo "::warning::SUPABASE_PUBLISHABLE_KEY is not set. This APK will use local/offline mode."
          fi

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONIUM-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
