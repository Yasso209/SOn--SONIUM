name: SONIUM Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonium-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Supabase Publishable keys are designed to be embedded in client apps.
      # Database security is enforced by RLS; never place a Secret/service_role key here.
      - name: Configure Supabase public client
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://jengdekjfrizdypysjef.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1H0yIKTRQ5nrkdQSuD1xkA_a2g7vQOd
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK with embedded JavaScript bundle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify embedded bundle and sign installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -Eq 'assets/index\.android\.bundle$'

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -storepass android -keypass android \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$RUNNER_TEMP/SONIUM-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$GITHUB_WORKSPACE/SONIUM.apk" \
            "$RUNNER_TEMP/SONIUM-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$GITHUB_WORKSPACE/SONIUM.apk"
          unzip -l "$GITHUB_WORKSPACE/SONIUM.apk" | grep 'assets/index.android.bundle'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SONIUM-release-apk
          path: SONIUM.apk
          if-no-files-found: error
          retention-days: 14
